name: CI

# Runs on every push and pull request. Free for private repositories within GitHub's monthly Actions minutes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Migration SQL is in sync with src/lib/schema.ts
        run: |
          npm run gen:migration
          git diff --exit-code -- migrations
      - name: Tests (run inside the real Workers runtime)
        run: npm test
      - name: Production dependencies have no known high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: The Worker bundles for deployment (no credentials used)
        run: npx wrangler deploy --dry-run --outdir dist
